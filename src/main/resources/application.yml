server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: healthcare-system
  profiles:
    active: dev
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  clinic:
    name: "ApexCare Health Hospital"
    contact-phone: "+1-800-555-0199"
    contact-email: "support@apexcare.health"
    default-slot-duration-minutes: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
